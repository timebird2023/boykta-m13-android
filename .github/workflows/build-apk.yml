name: Build Boykta M13 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK (armeabi-v7a)
        run: gradle assembleDebug --no-daemon

      - name: Rename Output APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Boykta-M13-armeabi-v7a.apk

      - name: Upload Boykta APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Boykta-M13-armeabi-v7a-apk
          path: Boykta-M13-armeabi-v7a.apk
