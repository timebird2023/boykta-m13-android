name: Build Boykta M13 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses & Install SDK 34
        run: |
          SDK_MANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          yes | "$SDK_MANAGER" --licenses > /dev/null 2>&1 || true
          "$SDK_MANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Configure Persistent Boykta Signing Keystore
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore

      - name: Download Sherpa-ONNX Android AAR (Offline Arabic TTS Engine)
        run: |
          mkdir -p app/libs
          curl -fL "https://huggingface.co/csukuangfj/sherpa-onnx-libs/resolve/main/android/aar/1.12.18/sherpa-onnx-static-link-onnxruntime-1.12.18.aar" -o app/libs/sherpa-onnx.aar
          ls -lh app/libs/sherpa-onnx.aar

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK (armeabi-v7a)
        run: gradle assembleDebug --no-daemon

      - name: Rename Output APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Boykta-M13-armeabi-v7a.apk

      - name: Upload Boykta APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Boykta-M13-armeabi-v7a-apk
          path: Boykta-M13-armeabi-v7a.apk
